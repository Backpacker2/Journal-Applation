<!doctype html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leerjournaal</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Leerjournaal">
  <meta name="theme-color" content="#0e1016">
  <link rel="stylesheet" href="/style.css">
  <script>try { const t = localStorage.getItem('lj-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">☰</button>
    <span id="topbar-title">Leerjournaal</span>
  </header>
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">L</span><span>Leerjournaal</span></div>

    <div class="search-wrap"><input id="search" type="search" placeholder="Zoeken in alles…" autocomplete="off" spellcheck="false"></div>
    <button class="nav-item" id="all-docs-btn"><span class="nav-ico">▤</span>Alle documenten</button>

    <div class="section-head">
      <span>Projecten</span>
      <button class="icon-btn" data-new="projecten" title="Nieuw project">+</button>
    </div>
    <nav id="list-projecten" class="space-list"></nav>

    <div id="archive" class="archive" hidden></div>

    <div class="spacer"></div>

    <div id="update-box" class="update-box" hidden></div>

    <div class="sync-box">
      <div class="sync-line"><span class="dot ok"></span><span>Versleuteld (AES-256)</span></div>
      <div id="sync-status" class="sync-sub">Laden…</div>
      <div class="sync-actions">
        <button id="sync-btn" class="btn small">Sync met GitHub</button>
        <button id="keys-btn" class="btn small ghost" title="Sleutels beheren">Sleutels</button>
        <button id="settings-btn" class="btn small ghost" title="Instellingen">Instellingen</button>
      </div>
      <div id="version" class="version"></div>
    </div>
  </aside>

  <main id="main">
    <div class="empty-state">
      <h1>Welkom bij je leerjournaal</h1>
      <p>Maak links een <strong>project</strong> aan voor school of werk, of een <strong>chat</strong> voor iets waar je gewoon even over wilt nadenken.</p>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
